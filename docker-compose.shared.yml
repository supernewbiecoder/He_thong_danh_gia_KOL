# Team-shared environment: adds PostgreSQL and daily backups on top of docker-compose.yml.
# Do not run it by hand; scripts/shared.sh passes the right files and .env.shared.
#
#   ./scripts/shared.sh up
#
# Nothing here listens on the network directly. Ports stay on 127.0.0.1 and `tailscale serve`
# forwards them to members of the tailnet. See docs/shared-infrastructure.md.
services:
  grafana:
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set it in .env.shared}

  postgres:
    image: postgres:16.6
    container_name: kol-postgres
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:5432:5432"
    environment:
      POSTGRES_USER: kol_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set it in .env.shared}
      POSTGRES_DB: kol
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set it in .env.shared}
      POSTGRES_READONLY_PASSWORD: ${POSTGRES_READONLY_PASSWORD:?set it in .env.shared}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs only once, when the data volume is empty
      - ./config/postgres/init:/docker-entrypoint-initdb.d:ro
      # Same DDL the writer applies on startup; numbered so it runs after 01-roles.sh
      - ./dbwriter/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kol_admin -d kol"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1g
    restart: unless-stopped

  postgres-backup:
    image: postgres:16.6
    container_name: kol-postgres-backup
    entrypoint: ["bash", "/scripts/pg-backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: kol_admin
      PGPASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set it in .env.shared}
      PGDATABASE: kol
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./scripts:/scripts:ro
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Reads kol.raw.* from Kafka and stores every event in PostgreSQL (Module 4).
  # At-least-once: offsets are committed only after the database transaction commits.
  db-writer:
    build: ./dbwriter
    image: kol-dbwriter:1.0.0
    container_name: kol-db-writer
    environment:
      BOOTSTRAP_SERVERS: kafka-1:19092,kafka-2:19092,kafka-3:19092
      DATABASE_URL: postgresql://kol_app:${POSTGRES_APP_PASSWORD:?set it in .env.shared}@postgres:5432/kol
      DB_WRITER_GROUP: ${DB_WRITER_GROUP:-postgres-writer}
      DB_WRITER_BATCH_SIZE: ${DB_WRITER_BATCH_SIZE:-500}
      DB_WRITER_RETRY_SECONDS: ${DB_WRITER_RETRY_SECONDS:-5}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Stores the results of Module 3 (kol.metrics.*) in kol.kol_scores / kol_score_history /
  # keyword_metrics. Same image as db-writer, different entry point.
  metrics-writer:
    image: kol-dbwriter:1.0.0
    container_name: kol-metrics-writer
    command: ["python", "metrics_writer.py"]
    environment:
      BOOTSTRAP_SERVERS: kafka-1:19092,kafka-2:19092,kafka-3:19092
      DATABASE_URL: postgresql://kol_app:${POSTGRES_APP_PASSWORD:?set it in .env.shared}@postgres:5432/kol
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db-writer:
        condition: service_started
    restart: unless-stopped

  # Module 3 restores each KOL's cumulative totals from kol.kol_scores after a restart.
  stream-processor:
    environment:
      DATABASE_URL: postgresql://kol_app:${POSTGRES_APP_PASSWORD:?set it in .env.shared}@postgres:5432/kol

volumes:
  postgres-data:
