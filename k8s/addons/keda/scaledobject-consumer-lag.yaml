# OPTIONAL: scale the consumer on Kafka consumer lag instead of CPU (better fit for stream processing).
#
# 1. Install KEDA:   kubectl apply --server-side -f https://github.com/kedacore/keda/releases/download/v2.16.0/keda-2.16.0.yaml
# 2. Remove the CPU HPA (KEDA creates its own):  kubectl -n kol-system delete hpa loadgen-consumer
# 3. kubectl apply -f k8s/addons/keda/scaledobject-consumer-lag.yaml
#
# KEDA targets roughly ceil(total lag / lagThreshold) replicas, capped by the partition count.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: loadgen-consumer-lag
  namespace: kol-system
spec:
  scaleTargetRef:
    name: loadgen-consumer
  minReplicaCount: 1
  maxReplicaCount: 6
  pollingInterval: 10
  cooldownPeriod: 120
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka.kol-system.svc.cluster.local:9092
        consumerGroup: loadgen-consumer
        topic: kol.loadtest
        lagThreshold: "2000"
        offsetResetPolicy: latest
