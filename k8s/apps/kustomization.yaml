# Load test and auto-scaling demo on top of the platform (Module 3 itself is in k8s/base).
# Deploy after scripts/k8s-deploy.sh:  kubectl apply -k k8s/apps
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kol-system

labels:
  - pairs:
      app.kubernetes.io/part-of: kol-platform

resources:
  - loadgen.yaml
  - loadgen-consumer-hpa.yaml
