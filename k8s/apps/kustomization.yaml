# Workloads that run on top of the infrastructure (load test + auto-scaling demo).
# Deploy after scripts/k8s-deploy.sh:  kubectl apply -k k8s/apps
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kol-system

labels:
  - pairs:
      app.kubernetes.io/part-of: kol-platform

resources:
  - loadgen.yaml
  - loadgen-consumer-hpa.yaml
