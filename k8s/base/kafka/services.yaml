# Headless service: stable DNS per pod (kafka-0.kafka-headless.kol-system.svc.cluster.local).
# publishNotReadyAddresses lets the controllers find each other before they are ready.
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  labels:
    app.kubernetes.io/name: kafka
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: internal
      port: 9092
    - name: controller
      port: 9093
---
# Bootstrap service for in-cluster clients: kafka.kol-system.svc.cluster.local:9092
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels:
    app.kubernetes.io/name: kafka
spec:
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: internal
      port: 9092
      targetPort: internal
---
# Per-broker NodePorts so that clients on the host can connect
# (advertised as ${KOL_EXTERNAL_HOST}:3009<ordinal>). Docker Desktop exposes NodePorts on localhost.
apiVersion: v1
kind: Service
metadata:
  name: kafka-0-external
  labels:
    app.kubernetes.io/name: kafka
spec:
  type: NodePort
  selector:
    statefulset.kubernetes.io/pod-name: kafka-0
  ports:
    - name: external
      port: 9094
      targetPort: external
      nodePort: 30090
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-1-external
  labels:
    app.kubernetes.io/name: kafka
spec:
  type: NodePort
  selector:
    statefulset.kubernetes.io/pod-name: kafka-1
  ports:
    - name: external
      port: 9094
      targetPort: external
      nodePort: 30091
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-2-external
  labels:
    app.kubernetes.io/name: kafka
spec:
  type: NodePort
  selector:
    statefulset.kubernetes.io/pod-name: kafka-2
  ports:
    - name: external
      port: 9094
      targetPort: external
      nodePort: 30092
