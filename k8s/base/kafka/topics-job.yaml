# Creates/updates topics from config/topics.conf (same script as the Compose `kafka-init` service).
# Jobs are immutable: scripts/k8s-deploy.sh deletes it before every apply.
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics-init
  labels:
    app.kubernetes.io/name: kafka-topics-init
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-topics-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-topics
          image: kol-kafka:3.9.0
          imagePullPolicy: IfNotPresent
          command: ["bash", "/scripts/create-topics.sh"]
          env:
            - name: BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: TOPICS_FILE
              value: /scripts/topics.conf
            - name: MAX_WAIT_SECONDS
              value: "600"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: kafka-topics
