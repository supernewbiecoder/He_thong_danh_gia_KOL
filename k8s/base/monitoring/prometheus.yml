# Prometheus config for Kubernetes. Targets are discovered from pod annotations:
#   prometheus.io/scrape: "true"
#   prometheus.io/port:   "<port>"
#   prometheus.io/path:   "/metrics"        (optional)
#   prometheus.io/job:    "<job name>"      (optional, defaults to the pod's app.kubernetes.io/name)
# Job names match monitoring/prometheus/prometheus.yml (Compose) so the same dashboard/alerts work.
global:
  scrape_interval: 5s
  evaluation_interval: 15s
  external_labels:
    cluster: kol-k8s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: kubernetes-pods
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [kol-system]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_phase]
        action: drop
        regex: (Succeeded|Failed)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        regex: (.+)
        target_label: __metrics_path__
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        action: replace
        target_label: job
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_job]
        action: replace
        regex: (.+)
        target_label: job
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: instance
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node
