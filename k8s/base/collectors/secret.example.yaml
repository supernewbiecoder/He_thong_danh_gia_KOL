# TEMPLATE ONLY - not listed in kustomization.yaml, so no credential is ever committed or applied
# by `kubectl apply -k`. The Deployment references this name with optional: true.
#
#   kubectl -n kol-system create secret generic collector-credentials \
#     --from-literal=youtube-api-key=YOUR_KEY
#
# After creating or updating it:
#   kubectl -n kol-system rollout restart deploy/social-collectors
apiVersion: v1
kind: Secret
metadata:
  name: collector-credentials
type: Opaque
stringData:
  youtube-api-key: REPLACE_ME
