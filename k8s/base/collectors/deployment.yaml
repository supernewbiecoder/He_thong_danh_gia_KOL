# Module 2 on Kubernetes: collects YouTube/Bluesky and publishes to kol.raw.*.
#
# A single replica is required, not a limitation: the Bluesky Jetstream firehose is one ordered
# stream, and two consumers would publish the same event twice (dedup is per process).
# The Deployment uses Recreate so two pods never hold the cursor PVC at the same time.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: social-collectors
  labels:
    app.kubernetes.io/name: social-collectors
    app.kubernetes.io/component: collector
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: social-collectors
  template:
    metadata:
      labels:
        app.kubernetes.io/name: social-collectors
        app.kubernetes.io/component: collector
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        # The cursor PVC is mounted writable; without fsGroup a non-root UID cannot create the file.
        fsGroup: 10001
      containers:
        - name: collectors
          image: kol-collectors:1.0.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: collectors-config
          env:
            - name: BOOTSTRAP_SERVERS
              value: kafka:9092
            # Optional: without the secret the collector still runs and only logs that YouTube
            # is disabled, so a fresh cluster works before credentials are added.
            - name: YOUTUBE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: collector-credentials
                  key: youtube-api-key
                  optional: true
          volumeMounts:
            - name: cursors
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
      volumes:
        - name: cursors
          persistentVolumeClaim:
            claimName: social-collectors-cursors
---
# Bluesky firehose cursor. Without it, a rescheduled pod restarts from "now" and silently skips
# everything published while it was down.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: social-collectors-cursors
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
