# TEMPLATE ONLY - this file is deliberately NOT listed in kustomization.yaml, so no password is
# ever committed or applied by `kubectl apply -k`.
#
# scripts/k8s-deploy.sh creates the real secret with random passwords the first time it runs,
# and leaves it untouched afterwards:
#
#   kubectl -n kol-system get secret postgres-credentials
#
# To do it by hand:
#
#   kubectl -n kol-system create secret generic postgres-credentials \
#     --from-literal=admin-password="$(openssl rand -hex 24)" \
#     --from-literal=app-password="$(openssl rand -hex 24)" \
#     --from-literal=readonly-password="$(openssl rand -hex 24)"
#
# Rotating a password later needs ALTER ROLE as well; the postgres image reads these values only
# when the data volume is empty.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
type: Opaque
stringData:
  admin-password: REPLACE_ME_ADMIN
  app-password: REPLACE_ME_APP
  readonly-password: REPLACE_ME_READONLY
