# TEMPLATE ONLY - deliberately NOT listed in kustomization.yaml, so no password is ever committed
# or applied by `kubectl apply -k`.
#
# scripts/k8s-deploy.sh creates the three real secrets with random passwords the first time it
# runs, and never touches them afterwards. CloudNativePG requires the basic-auth type.
#
# By hand:
#   for s in app:kol_app readonly:kol_readonly superuser:postgres; do
#     kubectl -n kol-system create secret generic "kol-db-${s%%:*}" --type=kubernetes.io/basic-auth \
#       --from-literal=username="${s#*:}" --from-literal=password="$(openssl rand -hex 24)"
#   done
#
# Read a password:
#   kubectl -n kol-system get secret kol-db-app -o jsonpath='{.data.password}' | base64 -d
apiVersion: v1
kind: Secret
metadata:
  name: kol-db-app
type: kubernetes.io/basic-auth
stringData:
  username: kol_app
  password: REPLACE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: kol-db-readonly
type: kubernetes.io/basic-auth
stringData:
  username: kol_readonly
  password: REPLACE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: kol-db-superuser
type: kubernetes.io/basic-auth
stringData:
  username: postgres
  password: REPLACE_ME
