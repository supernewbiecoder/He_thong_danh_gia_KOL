# Node drains and cluster upgrades move the pod, they do not silently kill the database.
# With a single replica there is a short write outage during the move; the writer retries because
# it only commits Kafka offsets after PostgreSQL commits.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: postgres
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
