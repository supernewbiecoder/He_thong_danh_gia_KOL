# Kafka topic definitions - single source of truth for Docker Compose and Kubernetes.
# Applied idempotently by scripts/create-topics.sh (create if missing, grow partitions,
# update configs). Partitions can only be increased, never decreased.
#
# Format: <name> <partitions> <replication_factor> <configs: k=v,k=v | ->
# Do not use commas inside a config value.
#
# retention.bytes is per partition, per replica, and whichever limit (time or size) is hit first
# deletes old data. It stops a busy topic from filling the disk of the machine hosting the cluster.
# Worst case across all topics: about 60 GiB (see docs/shared-infrastructure.md).

# --- Raw events from the collectors (Module 2: data collection) --------------------------
# Bluesky firehose has the highest throughput -> more partitions.
kol.raw.bluesky              6   3   retention.ms=259200000,retention.bytes=2147483648,min.insync.replicas=2
kol.raw.youtube              3   3   retention.ms=604800000,retention.bytes=536870912,min.insync.replicas=2
kol.raw.reddit               3   3   retention.ms=604800000,retention.bytes=536870912,min.insync.replicas=2

# --- Results from the stream consumer (Module 3) -> read by DB writer / API (Modules 4, 5) ----
# Key = kol_id. Compaction keeps the latest score per KOL.
kol.metrics.kol-scores       3   3   cleanup.policy=compact,min.insync.replicas=2,segment.ms=3600000
kol.metrics.keywords         3   3   retention.ms=86400000,retention.bytes=268435456,min.insync.replicas=2

# --- Messages that could not be parsed or processed (any module) -----------------------
kol.dlq                      3   3   retention.ms=1209600000,retention.bytes=268435456,min.insync.replicas=2

# --- Load testing only (do not use for real data) -----------------------------------------
kol.loadtest                 6   3   retention.ms=3600000,retention.bytes=536870912,min.insync.replicas=2

# --- Connectivity checks and experiments on the shared cluster (scripts/check_shared.py) ----
kol.dev.sandbox              3   3   retention.ms=86400000,retention.bytes=268435456,min.insync.replicas=2
