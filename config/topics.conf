# Kafka topic definitions - single source of truth for Docker Compose and Kubernetes.
# Applied idempotently by scripts/create-topics.sh (create if missing, grow partitions,
# update configs). Partitions can only be increased, never decreased.
#
# Format: <name> <partitions> <replication_factor> <configs: k=v,k=v | ->
# Do not use commas inside a config value.

# --- Raw events from the collectors (Module 2: data collection) --------------------------
# Bluesky firehose has the highest throughput -> more partitions.
kol.raw.bluesky              6   3   retention.ms=259200000,min.insync.replicas=2
kol.raw.youtube              3   3   retention.ms=604800000,min.insync.replicas=2
kol.raw.reddit               3   3   retention.ms=604800000,min.insync.replicas=2

# --- Results from the stream consumer (Module 3) -> read by DB writer / API (Modules 4, 5) ----
# Key = kol_id. Compaction keeps the latest score per KOL.
kol.metrics.kol-scores       3   3   cleanup.policy=compact,min.insync.replicas=2,segment.ms=3600000
kol.metrics.keywords         3   3   retention.ms=86400000,min.insync.replicas=2

# --- Messages that could not be parsed or processed (any module) -----------------------
kol.dlq                      3   3   retention.ms=1209600000,min.insync.replicas=2

# --- Load testing only (do not use for real data) -----------------------------------------
kol.loadtest                 6   3   retention.ms=3600000,min.insync.replicas=2
