# KOL Platform - distributed infrastructure (local / demo environment)
#
#   docker compose up -d --build                  # Kafka cluster + UI + monitoring
#   docker compose --profile loadtest up -d       # + load generator (producer + consumer)
#
# Endpoints (host):
#   Kafka bootstrap   localhost:9092,localhost:9093,localhost:9094
#   Kafka UI          http://localhost:8080
#   Prometheus        http://localhost:9090
#   Grafana           http://localhost:3000   (admin / admin)
#
# Containers of other modules join the `kol-net` network and use
#   kafka-1:19092,kafka-2:19092,kafka-3:19092
name: kol-platform

x-kafka-env: &kafka-env
  CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
  # KRaft combined mode: every node is both broker and controller (3-voter quorum)
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:19093,2@kafka-2:19093,3@kafka-3:19093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  # Durability: 3 replicas, writes with acks=all need 2 in-sync replicas -> survives 1 broker down
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_NUM_PARTITIONS: 6
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_LOG_RETENTION_HOURS: 168
  KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xms512m -Xmx512m}
  JMX_EXPORTER_PORT: 7071

x-kafka-base: &kafka-base
  image: kol-kafka:${KAFKA_VERSION:-3.9.0}
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "KAFKA_HEAP_OPTS=-Xmx128m /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1 || exit 1"]
    interval: 15s
    timeout: 20s
    retries: 10
    start_period: 40s
  deploy:
    resources:
      limits:
        memory: ${KAFKA_MEMORY_LIMIT:-1g}

x-kafka-ready: &kafka-ready
  kafka-1:
    condition: service_healthy
  kafka-2:
    condition: service_healthy
  kafka-3:
    condition: service_healthy

services:
  # ---------------------------------------------------------------- Kafka cluster (KRaft)
  kafka-1:
    <<: *kafka-base
    build:
      context: ./docker/kafka
      args:
        KAFKA_VERSION: ${KAFKA_VERSION:-3.9.0}
    container_name: kafka-1
    hostname: kafka-1
    ports:
      - "9092:9092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:19093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:19092,EXTERNAL://localhost:9092
    volumes:
      - kafka-1-data:/var/lib/kafka/data

  kafka-2:
    <<: *kafka-base
    container_name: kafka-2
    hostname: kafka-2
    ports:
      - "9093:9093"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:19093,EXTERNAL://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:19092,EXTERNAL://localhost:9093
    volumes:
      - kafka-2-data:/var/lib/kafka/data

  kafka-3:
    <<: *kafka-base
    container_name: kafka-3
    hostname: kafka-3
    ports:
      - "9094:9094"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:19093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:19092,EXTERNAL://localhost:9094
    volumes:
      - kafka-3-data:/var/lib/kafka/data

  # One-shot job: create/update topics from config/topics.conf
  kafka-init:
    image: kol-kafka:${KAFKA_VERSION:-3.9.0}
    container_name: kafka-init
    entrypoint: ["bash", "/scripts/create-topics.sh"]
    environment:
      BOOTSTRAP_SERVERS: kafka-1:19092,kafka-2:19092,kafka-3:19092
      TOPICS_FILE: /config/topics.conf
    volumes:
      - ./scripts:/scripts:ro
      - ./config:/config:ro
    depends_on: *kafka-ready
    restart: "no"

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.1.0
    container_name: kafka-ui
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: kol-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:19092,kafka-2:19092,kafka-3:19092
      KAFKA_CLUSTERS_0_METRICS_TYPE: PROMETHEUS
      KAFKA_CLUSTERS_0_METRICS_PORT: 7071
      DYNAMIC_CONFIG_ENABLED: "false"
    depends_on: *kafka-ready
    restart: unless-stopped

  # ---------------------------------------------------------------- Monitoring
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    container_name: kafka-exporter
    command:
      - --kafka.server=kafka-1:19092
      - --kafka.server=kafka-2:19092
      - --kafka.server=kafka-3:19092
      - --refresh.metadata=30s
    ports:
      - "9308:9308"
    depends_on: *kafka-ready
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-7d}
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/rules/alerts.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/kafka-overview.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  # ---------------------------------------------------------------- Load testing (profile: loadtest)
  loadgen-producer:
    build: ./loadtest
    image: kol-loadgen:1.0.0
    profiles: ["loadtest"]
    command: ["produce"]
    environment:
      BOOTSTRAP_SERVERS: kafka-1:19092,kafka-2:19092,kafka-3:19092
      LOADGEN_TOPIC: ${LOADGEN_TOPIC:-kol.loadtest}
      LOADGEN_RATE: ${LOADGEN_RATE:-2000}
      LOADGEN_DURATION: ${LOADGEN_DURATION:-300}
      LOADGEN_PADDING_BYTES: ${LOADGEN_PADDING_BYTES:-0}
      LOADGEN_REPORT: /app/results/producer-latest.json
    volumes:
      - ./loadtest/results:/app/results
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: "no"

  loadgen-consumer:
    image: kol-loadgen:1.0.0
    profiles: ["loadtest"]
    command: ["consume"]
    environment:
      BOOTSTRAP_SERVERS: kafka-1:19092,kafka-2:19092,kafka-3:19092
      LOADGEN_TOPIC: ${LOADGEN_TOPIC:-kol.loadtest}
      LOADGEN_GROUP: ${LOADGEN_GROUP:-loadgen-consumer}
      LOADGEN_DURATION: "0"
      LOADGEN_PROCESS_DELAY_MS: ${LOADGEN_PROCESS_DELAY_MS:-0}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  prometheus-data:
  grafana-data:

networks:
  default:
    name: kol-net
